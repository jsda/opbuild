name: Build

# All build/release/cleanup behavior reads its configuration from builder.yml.
# The cron schedule below is the only knob that cannot be expressed there
# (GitHub Actions cron values must be static strings in this file).
on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * 6"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  config:
    name: Load builder.yml
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      upstream_repo: ${{ steps.cfg.outputs.upstream_repo }}
      upstream_branch: ${{ steps.cfg.outputs.upstream_branch }}
      nss_repo: ${{ steps.cfg.outputs.nss_repo }}
      nss_branch: ${{ steps.cfg.outputs.nss_branch }}
      device: ${{ steps.cfg.outputs.device }}
      device_dir: ${{ steps.cfg.outputs.device_dir }}
      release_prefix: ${{ steps.cfg.outputs.release_prefix }}
      release_keep: ${{ steps.cfg.outputs.release_keep }}
      artifact_retention_days: ${{ steps.cfg.outputs.artifact_retention_days }}
      feeds_lines: ${{ steps.cfg.outputs.feeds_lines }}
      diy_build_dir: ${{ steps.cfg.outputs.diy_build_dir }}  # 自定义变量
    steps:
      - uses: actions/checkout@v6
      - id: cfg
        run: bash scripts/load-config.sh  # 自定义变量

  check-updates:
    name: Check upstream
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPO: ${{ needs.config.outputs.upstream_repo }}
      UPSTREAM_BRANCH: ${{ needs.config.outputs.upstream_branch }}
      NSS_REPO: ${{ needs.config.outputs.nss_repo }}
      NSS_BRANCH: ${{ needs.config.outputs.nss_branch }}
    outputs:
      build_required: ${{ steps.check.outputs.build_required }}
      main_sha: ${{ steps.check.outputs.main_sha }}
      nss_sha: ${{ steps.check.outputs.nss_sha }}
    steps:
      - id: check
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/${UPSTREAM_REPO}/commits/${UPSTREAM_BRANCH}" --jq .sha)
          nss_sha=$(gh api "repos/${NSS_REPO}/commits/${NSS_BRANCH}" --jq .sha)

          latest_release_body=$(gh release view --repo "${GITHUB_REPOSITORY}" --json body --jq .body 2>/dev/null || echo "")

          build_required=true
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]] \
             && [[ "$latest_release_body" == *"$main_sha"* ]] \
             && [[ "$latest_release_body" == *"$nss_sha"* ]]; then
            build_required=false
          fi

          {
            echo "## Upstream check"
            echo "- upstream: \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\` -> \`${main_sha}\`"
            echo "- nss:      \`${NSS_REPO}@${NSS_BRANCH}\` -> \`${nss_sha}\`"
            echo "- build_required: **${build_required}**"
          } >>"$GITHUB_STEP_SUMMARY"

          {
            echo "build_required=$build_required"
            echo "main_sha=$main_sha"
            echo "nss_sha=$nss_sha"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build firmware
    needs: [config, check-updates]
    if: needs.check-updates.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_SHA: ${{ needs.check-updates.outputs.main_sha }}
      NSS_SHA: ${{ needs.check-updates.outputs.nss_sha }}
      DEVICE: ${{ needs.config.outputs.device }}
      DEVICE_DIR: ${{ needs.config.outputs.device_dir }}
      RELEASE_PREFIX: ${{ needs.config.outputs.release_prefix }}
      ARTIFACT_RETENTION_DAYS: ${{ needs.config.outputs.artifact_retention_days }}
      FEEDS_LINES: ${{ needs.config.outputs.feeds_lines }}
      DIY_BUILD_DIR: ${{ needs.config.outputs.diy_build_dir }}  # 自定义变量
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Free disk space  # 自定义变量
        uses: jsda/actions@free-disk
        with:
          build-mount-path: ${{ env.DIY_BUILD_DIR }}

      - name: Ensure build path  # 自定义变量
        run: |
          sudo mkdir -p "${{ env.DIY_BUILD_DIR }}"
          sudo chown -R "$USER:$USER" "${{ env.DIY_BUILD_DIR }}"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

          echo -e "当前可用空间\n $(df -hT)" >> "$GITHUB_STEP_SUMMARY"  # 自定义变量

      - name: Checkout OpenWrt source
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.config.outputs.upstream_repo }}
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 0
          path: openwrt

      - name: Checkout builder repo
        uses: actions/checkout@v6
        with:
          path: builder

      - name: Move source  # 自定义变量
        run: |
          sudo rsync -a openwrt/ "${{ env.DIY_BUILD_DIR }}/"

      # =========================
      # ✅ 缓存（优化核心）
      # =========================
      - name: Cache dl  # 自定义变量
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.DIY_BUILD_DIR }}/dl
          key: dl-${{ runner.os }}-${{ env.RELEASE_PREFIX }}-${{ env.MAIN_SHA }}
          restore-keys: |
            dl-${{ runner.os }}-${{ env.RELEASE_PREFIX }}-
            dl-

      - name: Cache toolchain  # 自定义变量
        id: cache_toolchain
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.DIY_BUILD_DIR }}/staging_dir/host*
            ${{ env.DIY_BUILD_DIR }}/staging_dir/tool*
          key: toolchain-${{ env.RELEASE_PREFIX }}-${{ env.MAIN_SHA }}
          restore-keys: |
            toolchain-${{ env.RELEASE_PREFIX }}-

      - name: Cache ccache  # 自定义变量
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.DIY_BUILD_DIR }}/.ccache
          key: ccache-${{ env.RELEASE_PREFIX }}-${{ env.MAIN_SHA }}
          restore-keys: |
            ccache-${{ env.RELEASE_PREFIX }}-

      - name: Fix Toolchain Timestamp  # 自定义变量
        if: steps.cache_toolchain.outputs.cache-hit == 'true'
        run: |
          echo "Fixing toolchain stamps..."
          find "${{ env.DIY_BUILD_DIR }}/staging_dir/tool"* -name "*.stamp*" -exec touch {} + || true

          echo "Enabling ccache..."
          export CCACHE_DIR=${{ env.DIY_BUILD_DIR }}/.ccache
          export CCACHE_MAXSIZE=5G
          export CCACHE_COMPRESS=1
          export CCACHE_BASEDIR=${{ env.DIY_BUILD_DIR }}
          export CCACHE_HASHDIR=1
          export CCACHE_SLOPPINESS=time_macros,file_macro,locale
          ccache -M $CCACHE_MAXSIZE || true
          echo "ccache 缓存命中率" >> "$GITHUB_STEP_SUMMARY"
          ccache -s  >> "$GITHUB_STEP_SUMMARY" || true

      - name: Prepare build environment
        working-directory: ${{ env.DIY_BUILD_DIR }}  # 自定义变量
        env:
          OPENWRT_DIR: ${{ env.DIY_BUILD_DIR }}  # 自定义变量
          BUILDER_REPO: ${{ github.workspace }}/builder
        run: |
          bash ${{ github.workspace }}/builder/scripts/prepare-build.sh  # 自定义变量

      - name: Set reproducible-build env
        working-directory: ${{ env.DIY_BUILD_DIR }}  # 自定义变量
        run: |
          set -euo pipefail
          {
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "TZ=UTC"
            echo "LC_ALL=C"
            echo "KBUILD_BUILD_USER=builder"
            echo "KBUILD_BUILD_HOST=github"
          } >>"$GITHUB_ENV"

      - name: Download sources
        working-directory: ${{ env.DIY_BUILD_DIR }}  # 自定义变量
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            make download -j"$(nproc)" V=s && break
            echo "Download attempt $attempt failed; retrying..."
            sleep 5
          done

      - name: Build
        working-directory: ${{ env.DIY_BUILD_DIR }}  # 自定义变量
        run: |
          set -euo pipefail
          if ! make -j"$(nproc)"; then
            echo "::warning::Parallel build failed; retrying single-threaded for diagnostics"
            make -j1 V=s
          fi

          # 自定义变量
          mkdir -p upload
          find ./bin/targets/ -type d -name packages -exec rm -rf {} +
          find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

          echo -e "当前可用空间\n $(df -hT)" >> "$GITHUB_STEP_SUMMARY"
          echo -e "编译占用大小\n $(du -h --max-depth=1)" >> "$GITHUB_STEP_SUMMARY"

          # 自定义变量 删除过时源码
          ./scripts/dl_cleanup.py ./dl

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.config.outputs.device }}-images
          path: ${{ env.DIY_BUILD_DIR }}/upload  # 自定义变量
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Publish release
        id: release
        run: |
          set -euo pipefail
          date=$(date -u +%F)
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          tag_name="${RELEASE_PREFIX}-${timestamp}-${GITHUB_RUN_ID}"
          echo "release_tag=$tag_name" >>"$GITHUB_OUTPUT"

          {
            echo "## OpenWrt Build"
            echo "- **Date**: $date"
            echo "- **Device**: \`${DEVICE}\`"
            echo "- **Upstream**: \`${MAIN_SHA}\`"
            echo "- **NSS**: \`${NSS_SHA}\`"
            echo "- **Trigger**: \`${GITHUB_EVENT_NAME}\`"
          } >release_notes.md

          mapfile -t assets < <(find "${{ env.DIY_BUILD_DIR }}/upload" -type f -not -path "*/packages/*")  # 自定义变量
          gh release create "$tag_name" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenWrt Build $date" \
            --notes-file release_notes.md \
            "${assets[@]}"

          {
            echo "## Release"
            echo "- tag: \`${tag_name}\`"
            echo "- assets: ${#assets[@]}"
          } >>"$GITHUB_STEP_SUMMARY"

  prune:
    name: Prune old releases
    needs: [config, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KEEP: ${{ needs.config.outputs.release_keep }}
      CURRENT_TAG: ${{ needs.build.outputs.release_tag }}
      ARTIFACT_RETENTION_DAYS: ${{ needs.config.outputs.artifact_retention_days }}
    steps:
      - uses: actions/checkout@v6
      - run: |
          bash scripts/prune-releases.sh
          bash scripts/prune-workflows.sh  # 自定义变量
